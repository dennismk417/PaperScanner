<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paper Scanner</title>
<meta name="theme-color" content="#000000">
<script src="jspdf.umd.min.js"></script>
<style>
/* Screens: camera (start) → review/crop → session editor → export → My Scans library. One screen visible at a time. */
:root{--bg:#121519;--panel:#1c2127;--line:#2d343c;--fg:#eef1f4;--mute:#8e98a3;--accent:#3ad1a4;--ink:#04201a;--danger:#ff6b6b;
--ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#000;color:var(--fg);font-family:var(--ui);overflow:hidden}
.pad{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
button,select,input{font:600 15px var(--ui);border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:12px 14px;cursor:pointer}
input{font-weight:400;cursor:text;width:100%}
button:disabled{opacity:.4}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.danger{color:var(--danger)}
.grow{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
.top b{font-size:16px}
.bottom{display:flex;gap:8px;padding-top:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
.msg{font-size:13px;color:var(--mute);text-align:center;padding-block:6px}
/* camera */
#cam{background:#000}
#vid,#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#ov{touch-action:none}
.camtop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:calc(12px + env(safe-area-inset-top));z-index:2}
.chip{background:rgba(0,0,0,.55);color:#fff;border-color:rgba(255,255,255,.25);padding:9px 13px;font-size:14px;border-radius:20px}
.chip[aria-pressed=true]{background:#fff;color:#000}
#hint{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:7px 14px;border-radius:18px;font-size:14px;white-space:nowrap;pointer-events:none}
#camrow{position:absolute;left:0;right:0;bottom:calc(122px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
#mfRow{position:absolute;left:0;right:0;bottom:calc(170px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;color:#fff;font-size:13px}
#mfRow input{flex:1;padding:0}
#cambar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-top:14px;padding-bottom:calc(22px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.8))}
#cambar>:first-child{justify-self:start}#cambar>:last-child{justify-self:end}
#thumbBtn{width:56px;height:56px;padding:0;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.12);border:2px solid #fff;position:relative;color:#fff;font-size:12px}
#thumbBtn img{width:100%;height:100%;object-fit:cover;display:block}
#thumbBtn span{position:absolute;right:2px;bottom:2px;background:var(--accent);color:var(--ink);border-radius:8px;padding:0 5px;font-size:12px}
#shutter{width:78px;height:78px;padding:0;border-radius:50%;background:#fff;border:0}
#shutter svg{width:78px;height:78px;transform:rotate(-90deg);display:block}
.ring{fill:none;stroke:#cfd4d8;stroke-width:6}.prog{fill:none;stroke:#3ad1a4;stroke-width:6;stroke-dasharray:226;stroke-dashoffset:226}
#focusRing{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border:2px solid #ffd54a;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;transform:scale(1.3)}
#focusRing.on{opacity:1;transform:scale(1)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
/* crop + view stage */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;background:#0b0d10}
.wrap{position:relative;touch-action:none;line-height:0}
.wrap canvas{max-width:100%;max-height:100%}
.handle{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid var(--accent);background:rgba(58,209,164,.25);touch-action:none}
/* editor */
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-top:10px}
.tools button,.tools select{padding:10px 6px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tools .ic{font-size:18px;line-height:1}
#strip{display:flex;gap:8px;overflow-x:auto;padding-block:10px}
.pg{flex:none;width:58px;height:76px;padding:0;border-radius:8px;overflow:hidden;background:#0b0d10;position:relative;border:2px solid transparent}
.pg img{width:100%;height:100%;object-fit:contain;display:block}
.pg[aria-current=true]{border-color:var(--accent)}
.pg span{position:absolute;left:3px;top:3px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;border-radius:6px;padding:0 4px}
.pg.add{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--accent);border:2px dashed var(--line)}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.sheetbox{background:var(--panel);border-radius:18px 18px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.sheetbox h2{margin:0;font-size:17px}
.sheetbox label{font-size:13px;color:var(--mute)}
.fmts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fmts button{display:flex;flex-direction:column;gap:2px;padding:12px 6px}
.fmts button small{font-weight:400;font-size:11px;opacity:.75}
.fmts button[aria-pressed=true]{background:var(--accent);color:var(--ink);border-color:var(--accent)}
/* library */
#libList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-block:6px 20px}
.doc{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px;font-weight:400}
.doc img{width:64px;height:80px;object-fit:cover;border-radius:6px;background:#0b0d10}
.doc b{display:block;font-size:15px;margin-bottom:3px;word-break:break-word}
.doc small{color:var(--mute);font-size:12px}
.badge{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--mute)}
#docPages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;align-items:center;padding-block:12px}
#docPages img{max-width:100%;border-radius:4px;background:#fff}
.empty{margin:14vh auto 0;text-align:center;color:var(--mute);max-width:300px;line-height:1.5}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
</style>
</head>
<body>

<!-- 1. Camera -->
<section id="cam" class="screen">
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="ov"></canvas>
  <div id="focusRing"></div>
  <div class="camtop pad">
    <button class="chip" id="libBtn">📁 My Scans</button>
    <div style="display:flex;gap:8px">
      <button class="chip" id="torchBtn" aria-pressed="false" hidden>⚡ Light</button>
      <button class="chip" id="lensBtn" hidden>Lens 1</button>
      <button class="chip" id="autoBtn" aria-pressed="true">Auto</button>
    </div>
  </div>
  <div id="hint">Tap the screen to focus</div>
  <div id="mfRow" class="pad" hidden><span>Near</span><input type="range" id="mf" aria-label="Manual focus"><span>Far</span></div>
  <div id="camrow" class="pad"></div>
  <div id="cambar" class="pad">
    <button id="thumbBtn" aria-label="Open current document">Import</button>
    <button id="shutter" aria-label="Take photo"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="36" class="ring"/><circle id="prog" cx="40" cy="40" r="36" class="prog"/></svg></button>
    <button class="chip" id="toEdit" hidden>Done ›</button>
  </div>
  <div id="flash"></div>
</section>

<!-- 2. Review & crop (right after capture) -->
<section id="review" class="screen" hidden>
  <div class="top pad"><button id="rvRetake">↺ Retake</button><b>Adjust corners</b><button id="rvFull">Whole photo</button></div>
  <div class="stage" id="rvStage"><div class="wrap" id="rvWrap"><canvas id="rvCv"></canvas></div></div>
  <div class="msg pad">Drag the green circles onto the paper's corners if needed.</div>
  <div class="bottom pad"><button class="primary grow" id="rvOk">✓ Use this page</button></div>
</section>

<!-- 3. Session editor -->
<section id="edit" class="screen" hidden>
  <div class="top pad"><button id="edDiscard">✕ Discard</button><b id="edTitle">Page 1 of 1</b><button class="primary" id="edFinish">Finish</button></div>
  <div class="stage" id="edStage"><div class="wrap"><canvas id="edCv"></canvas></div></div>
  <div class="pad" style="background:var(--panel);border-top:1px solid var(--line)">
    <div class="tools">
      <button id="edCrop"><span class="ic">⌗</span>Crop</button>
      <button id="edRot"><span class="ic">↻</span>Rotate</button>
      <button id="edFilt"><span class="ic">◐</span><span id="edFiltName">No shadows</span></button>
      <button id="edDel" class="danger"><span class="ic">🗑</span><span id="edDelTxt">Delete</span></button>
    </div>
    <div id="strip"></div>
  </div>
  <div class="bottom pad" style="padding-top:0;border-top:0"><button class="grow" id="edAdd">📷 Add page</button><button class="primary grow" id="edFinish2">Save as… ›</button></div>
</section>

<!-- 4. Export sheet -->
<div id="exportSheet" class="sheet" hidden>
  <div class="sheetbox pad">
    <h2>Save document</h2>
    <label for="exName">File name</label>
    <input id="exName" autocomplete="off">
    <label>Format</label>
    <div class="fmts">
      <button data-f="pdf" aria-pressed="true">PDF<small>One file</small></button>
      <button data-f="jpg" aria-pressed="false">JPG<small>Picture per page</small></button>
      <button data-f="png" aria-pressed="false">PNG<small>Best quality</small></button>
    </div>
    <div class="msg" id="exWhere">Saved to Downloads and to My Scans</div>
    <div style="display:flex;gap:8px"><button class="grow" id="exCancel">Back</button><button class="primary grow" id="exGo">Save</button></div>
  </div>
</div>

<!-- 5. My Scans library -->
<section id="lib" class="screen" hidden>
  <div class="top pad"><button id="libBack">‹ Camera</button><b>My Scans</b><span style="width:80px"></span></div>
  <div id="libList" class="pad"></div>
</section>
<section id="docv" class="screen" hidden>
  <div class="top pad"><button id="dvBack">‹ My Scans</button><b id="dvTitle"></b><span style="width:80px"></span></div>
  <div id="docPages" class="pad"></div>
  <div class="bottom pad">
    <button class="grow" id="dvOpen">Open file</button>
    <button class="grow" id="dvEdit">Edit / re-save</button>
    <button class="danger" id="dvDel">Delete</button>
  </div>
</section>
<div id="toast" hidden style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:30;background:#eef1f4;color:#121519;padding:10px 16px;border-radius:20px;font-size:14px;max-width:90vw;text-align:center"></div>
<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const MODES=[['clean','No shadows'],['color','Original'],['enhance','Enhanced'],['gray','Greyscale'],['bw','Black & white']];
let session={pages:[],docId:null,name:''};
let cur=0;

/* ---------- Screen switching ---------- */
const SCREENS=['cam','review','edit','lib','docv'];
let screen='cam';
function show(id){
  SCREENS.forEach(s=>$(s).hidden=s!==id);screen=id;
  if(id==='cam')startCam();else stopCam();
}
let toastT;
function toast(m,ms=2600){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- Camera ---------- */
const vid=$('vid'),ov=$('ov'),octx=ov.getContext('2d');
let stream=null,track=null,caps={},lenses=[],lensIdx=0,smooth=null,steady=0,auto=lsGet('auto')!=='0',busy=false,loopT=0,focusT=0,starting=false;
const NEED=10;
$('autoBtn').setAttribute('aria-pressed',auto);$('autoBtn').textContent=auto?'Auto':'Manual';
async function startCam(){
  if(stream||starting)return;starting=true;
  const v={width:{ideal:1920},height:{ideal:1440}};
  if(lenses.length)v.deviceId={exact:lenses[lensIdx].deviceId};else v.facingMode={ideal:'environment'};
  try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:v})}
  catch(e){starting=false;$('hint').textContent='Camera blocked – allow camera access in Settings';return}
  starting=false;
  if(screen!=='cam'){stopCam();return}
  track=stream.getVideoTracks()[0];vid.srcObject=stream;try{await vid.play()}catch(e){}
  if(!lenses.length)await findLenses();
  setupCaps();refreshCamUI();
  smooth=null;steady=0;busy=false;clearTimeout(loopT);loop();
}
function stopCam(){clearTimeout(loopT);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;track=null}
async function findLenses(){
  try{const all=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    const back=all.filter(d=>/back|rear|environment/i.test(d.label));lenses=back.length?back:all;
    const want=lsGet('lens'),curId=track.getSettings().deviceId;
    let i=lenses.findIndex(d=>d.deviceId===want);
    if(i>=0&&want!==curId){lensIdx=i;stopCam();starting=false;return startCam()}
    lensIdx=Math.max(0,lenses.findIndex(d=>d.deviceId===curId));
  }catch(e){}
}
$('lensBtn').onclick=()=>{if(lenses.length<2)return;lensIdx=(lensIdx+1)%lenses.length;lsSet('lens',lenses[lensIdx].deviceId);stopCam();toast('Switching lens…',1200);startCam()};
function setupCaps(){
  caps={};try{caps=track.getCapabilities?track.getCapabilities():{}}catch(e){}
  const fm=caps.focusMode||[];
  if(fm.includes('continuous'))apply({focusMode:'continuous'});
  $('lensBtn').hidden=lenses.length<2;$('lensBtn').textContent='Lens '+(lensIdx+1)+'/'+lenses.length;
  $('torchBtn').hidden=!caps.torch;$('torchBtn').setAttribute('aria-pressed','false');
  const row=$('camrow');row.innerHTML='';$('mfRow').hidden=true;
  if(caps.zoom){const lv=[caps.zoom.min,1,1.5,2].filter((z,i,a)=>z>=caps.zoom.min&&z<=caps.zoom.max&&a.indexOf(z)===i);
    const setZ=z=>{apply({zoom:z});[...row.querySelectorAll('[data-z]')].forEach(b=>b.setAttribute('aria-pressed',+b.dataset.z===z))};
    lv.forEach(z=>{const b=document.createElement('button');b.className='chip';b.dataset.z=z;b.textContent=(Math.round(z*10)/10)+'×';b.onclick=()=>setZ(z);row.appendChild(b)});
    setZ(lv.includes(1)?1:lv[0])}
  if(caps.focusDistance){const s=$('mf');s.min=caps.focusDistance.min;s.max=caps.focusDistance.max;s.step=caps.focusDistance.step||0.01;
    const b=document.createElement('button');b.className='chip';b.textContent='Manual focus';b.setAttribute('aria-pressed','false');
    b.onclick=()=>{const on=$('mfRow').hidden;$('mfRow').hidden=!on;b.setAttribute('aria-pressed',on);if(!on&&fm.includes('continuous'))apply({focusMode:'continuous'})};row.appendChild(b)}
}
$('mf').oninput=e=>apply({focusMode:'manual',focusDistance:+e.target.value});
$('torchBtn').onclick=()=>{const on=$('torchBtn').getAttribute('aria-pressed')!=='true';apply({torch:on});$('torchBtn').setAttribute('aria-pressed',on)};
function apply(c){if(!track)return Promise.resolve();return track.applyConstraints({advanced:[c]}).catch(()=>{})}
$('autoBtn').onclick=()=>{auto=!auto;lsSet('auto',auto?'1':'0');$('autoBtn').textContent=auto?'Auto':'Manual';$('autoBtn').setAttribute('aria-pressed',auto);steady=0;setProg(0)};
// Tap to focus
ov.addEventListener('click',async e=>{
  if(!track)return;
  const r=ov.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;
  const fr=$('focusRing');fr.style.left=sx+'px';fr.style.top=sy+'px';fr.classList.remove('on');void fr.offsetWidth;fr.classList.add('on');
  const vw=vid.videoWidth,vh=vid.videoHeight,k=Math.min(r.width/vw,r.height/vh);
  const x=Math.min(1,Math.max(0,(sx-(r.width-vw*k)/2)/(vw*k))),y=Math.min(1,Math.max(0,(sy-(r.height-vh*k)/2)/(vh*k)));
  const fm=caps.focusMode||[],c={};
  if('pointsOfInterest' in caps)c.pointsOfInterest=[{x,y}];
  $('hint').textContent='Focusing…';steady=0;
  if(fm.includes('single-shot')){c.focusMode='single-shot';await apply(c)}
  else if(fm.includes('continuous')){await apply({focusMode:'manual'});await sleep(60);c.focusMode='continuous';await apply(c)}
  else if(c.pointsOfInterest)await apply(c);
  if(c.pointsOfInterest&&caps.exposureMode)apply({pointsOfInterest:[{x,y}]});
  clearTimeout(focusT);focusT=setTimeout(()=>{fr.classList.remove('on');if(fm.includes('continuous')&&$('mfRow').hidden)apply({focusMode:'continuous'})},5000);
});
function setProg(p){$('prog').style.strokeDashoffset=226*(1-p)}
function toScreen(p){const vw=vid.videoWidth,vh=vid.videoHeight,cw=ov.width,ch=ov.height,k=Math.min(cw/vw,ch/vh);
  return [(p[0]*k)+(cw-vw*k)/2,(p[1]*k)+(ch-vh*k)/2]}
function loop(){
  if(!stream)return;
  if(vid.videoWidth&&!busy){
    ov.width=ov.clientWidth;ov.height=ov.clientHeight;
    const q=detect(vid,true);
    octx.clearRect(0,0,ov.width,ov.height);
    if(q&&convex(q,vid.videoWidth*vid.videoHeight)){
      let move=1;
      if(smooth){move=q.reduce((m,p,i)=>Math.max(m,Math.hypot(p[0]-smooth[i][0],p[1]-smooth[i][1])),0)/vid.videoWidth;
        smooth=smooth.map((p,i)=>[p[0]*.5+q[i][0]*.5,p[1]*.5+q[i][1]*.5])}else smooth=q;
      steady=move<0.02?steady+1:0;
      const c=smooth.map(toScreen);
      octx.fillStyle='rgba(58,209,164,.2)';octx.strokeStyle='#3ad1a4';octx.lineWidth=4;
      octx.beginPath();octx.moveTo(...c[0]);c.slice(1).forEach(p=>octx.lineTo(...p));octx.closePath();octx.fill();octx.stroke();
      if($('hint').textContent!=='Focusing…'||steady>4)$('hint').textContent=auto?(steady>2?'Hold still…':'Paper found'):'Paper found – press the button';
      if(auto){setProg(Math.min(1,steady/NEED));if(steady>=NEED)capture()}
    }else{smooth=null;steady=0;setProg(0);if($('hint').textContent!=='Focusing…')$('hint').textContent='Tap the screen to focus'}
  }
  loopT=setTimeout(loop,120);
}
function convex(q,area0){for(let i=0;i<4;i++){const a=q[i],b=q[(i+1)%4],c=q[(i+2)%4];
  if((b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0])<=0)return false}
  return quadArea(q)>area0*0.08}
function quadArea(q){let a=0;for(let i=0;i<4;i++)a+=q[i][0]*q[(i+1)%4][1]-q[(i+1)%4][0]*q[i][1];return Math.abs(a)/2}
$('shutter').onclick=()=>capture();
async function capture(){
  if(busy||!vid.videoWidth)return;busy=true;steady=0;setProg(0);
  $('flash').style.opacity=1;setTimeout(()=>$('flash').style.opacity=0,150);
  const vw=vid.videoWidth,vh=vid.videoHeight,q=smooth;
  let c=null;
  // Prefer a full-resolution still (the camera refocuses for it); fall back to the preview frame
  if(window.ImageCapture&&track){try{
    const blob=await Promise.race([new ImageCapture(track).takePhoto(),sleep(3500).then(()=>{throw 0})]);
    const bm=await createImageBitmap(blob);const k=Math.min(1,3000/Math.max(bm.width,bm.height));
    c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  }catch(e){c=null}}
  if(!c){c=document.createElement('canvas');c.width=vw;c.height=vh;c.getContext('2d').drawImage(vid,0,0)}
  let corners;
  if(q&&Math.abs(c.width/c.height-vw/vh)<0.02){const s=c.width/vw;corners=q.map(p=>[p[0]*s,p[1]*s])}
  else corners=detect(c);
  pending={orig:c,corners,rot:0,mode:lsGet('mode')||'clean'};recropIdx=-1;
  openReview();
}

/* ---------- Import from gallery ---------- */
async function importFiles(e){
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  toast('Importing…');
  for(const f of files){const c=await fileToCanvas(f);if(!c)continue;
    const pg={orig:c,corners:detect(c),rot:0,mode:lsGet('mode')||'clean'};render(pg);session.pages.push(pg)}
  cur=session.pages.length-1;openEdit();
}
async function fileToCanvas(f){try{const bm=await createImageBitmap(f);const k=Math.min(1,3000/Math.max(bm.width,bm.height));
  const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c}catch(e){return null}}
function refreshCamUI(){
  const n=session.pages.length,tb=$('thumbBtn');

/* ---------- Review / crop ---------- */
let pending=null,recropIdx=-1;
function openReview(){show('review');requestAnimationFrame(()=>cropUI(pending))}
let cscale=1;
function cropUI(pg){
  const cv=$('rvCv'),x=cv.getContext('2d'),wrap=$('rvWrap'),st=$('rvStage');
  wrap.querySelectorAll('.handle').forEach(h=>h.remove());
  const im=pg.orig;cscale=Math.min((st.clientWidth-28)/im.width,(st.clientHeight-28)/im.height,1);
  cv.width=Math.round(im.width*cscale);cv.height=Math.round(im.height*cscale);
  const draw=()=>{const c=pg.corners.map(p=>[p[0]*cscale,p[1]*cscale]);x.drawImage(im,0,0,cv.width,cv.height);
    x.fillStyle='rgba(0,0,0,.5)';x.beginPath();x.rect(0,0,cv.width,cv.height);x.moveTo(...c[0]);[c[3],c[2],c[1]].forEach(p=>x.lineTo(...p));x.closePath();x.fill('evenodd');
    x.strokeStyle='#3ad1a4';x.lineWidth=3;x.beginPath();x.moveTo(...c[0]);c.slice(1).forEach(p=>x.lineTo(...p));x.closePath();x.stroke()};
  draw();
  pg.corners.forEach(p=>{const h=document.createElement('div');h.className='handle';wrap.appendChild(h);
    const place=()=>{h.style.left=p[0]*cscale+'px';h.style.top=p[1]*cscale+'px'};place();
    h.onpointerdown=e=>{e.preventDefault();h.setPointerCapture(e.pointerId);
      h.onpointermove=ev=>{const r=cv.getBoundingClientRect();p[0]=Math.max(0,Math.min(im.width,(ev.clientX-r.left)/cscale));p[1]=Math.max(0,Math.min(im.height,(ev.clientY-r.top)/cscale));place();draw()};
      h.onpointerup=h.onpointercancel=()=>{h.onpointermove=null}}});
}
$('rvFull').onclick=()=>{const W=pending.orig.width,H=pending.orig.height;pending.corners=[[0,0],[W,0],[W,H],[0,H]];cropUI(pending)};
$('rvRetake').onclick=()=>{if(recropIdx>=0){openEdit();return}pending=null;show('cam')};
$('rvOk').onclick=async()=>{$('rvOk').disabled=true;$('rvOk').textContent='Processing…';await sleep(30);
  render(pending);
  if(recropIdx>=0){session.pages[recropIdx]=pending;cur=recropIdx}else{session.pages.push(pending);cur=session.pages.length-1}

/* ---------- Session editor ---------- */
function render(pg){const c=warp(pg);pg.out=c;pg.src=c.toDataURL('image/jpeg',.9);pg.w=c.width;pg.h=c.height}
function rotate(c,r){if(!r)return c;const o=document.createElement('canvas');const sw=r%2;o.width=sw?c.height:c.width;o.height=sw?c.width:c.height;
  const x=o.getContext('2d');x.translate(o.width/2,o.height/2);x.rotate(r*Math.PI/2);x.drawImage(c,-c.width/2,-c.height/2);return o}
function openEdit(){if(!session.pages.length){show('cam');return}show('edit');requestAnimationFrame(drawEdit)}
function drawEdit(){
  const pg=session.pages[cur],cv=$('edCv'),st=$('edStage'),c=pg.out;
  const k=Math.min((st.clientWidth-28)/c.width,(st.clientHeight-28)/c.height,1);
  cv.width=Math.round(c.width*k);cv.height=Math.round(c.height*k);cv.getContext('2d').drawImage(c,0,0,cv.width,cv.height);
  $('edTitle').textContent='Page '+(cur+1)+' of '+session.pages.length;
  $('edFiltName').textContent=MODES.find(m=>m[0]===pg.mode)[1];
  const s=$('strip');s.innerHTML='';
  session.pages.forEach((p,i)=>{const b=document.createElement('button');b.className='pg';b.setAttribute('aria-current',i===cur);b.setAttribute('aria-label','Page '+(i+1));
    b.innerHTML=`<img src="${p.src}" alt=""><span>${i+1}</span>`;b.onclick=()=>{cur=i;drawEdit()};s.appendChild(b)});
  const a=document.createElement('button');a.className='pg add';a.textContent='+';a.setAttribute('aria-label','Add page');a.onclick=()=>show('cam');s.appendChild(a);

let dbp=null;
function db(){if(!dbp)dbp=new Promise((ok,no)=>{const r=indexedDB.open('scans',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});return dbp}
async function tx(mode,fn){const d=await db();return new Promise((ok,no)=>{const t=d.transaction('docs',mode),s=t.objectStore('docs');const r=fn(s);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})}

  const pages=[];for(const p of session.pages)pages.push({orig:await toBlob(p.orig,'image/jpeg',.9),corners:p.corners,rot:p.rot,mode:p.mode,out:await toBlob(p.out,'image/jpeg',.85)});
  const t=document.createElement('canvas'),o=session.pages[0].out,k=160/Math.max(o.width,o.height);t.width=o.width*k;t.height=o.height*k;t.getContext('2d').drawImage(o,0,0,t.width,t.height);

}

/* ---- Paper detection: works for any paper colour by contrasting it against the surface ---- */
function detect(im,live){
  const IW=im.videoWidth||im.width,IH=im.videoHeight||im.height;
  const W=live?160:240,H=Math.round(IH*W/IW),f=IW/W;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.drawImage(im,0,0,W,H);const d=x.getImageData(0,0,W,H).data;
  // Lab-ish colour per pixel
  const L=new Float32Array(W*H*3);
  for(let i=0;i<W*H;i++){const r=d[i*4],g=d[i*4+1],b=d[i*4+2];
    L[i*3]=(r+g+b)/3;L[i*3+1]=r-g;L[i*3+2]=(r+g)/2-b;}
  // Surface model = median colour of the outer border band
  const band=Math.max(3,Math.round(W*0.03)),bs=[[],[],[]];
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){if(xx<band||yy(y)||xx>=W-band){const i=y*W+xx;for(let k=0;k<3;k++)bs[k].push(L[i*3+k]);}}
  function yy(y){return y<band||y>=H-band}
  const med=bs.map(a=>{a.sort((p,q)=>p-q);return a[a.length>>1]});
  const mad=bs.map((a,k)=>{const dv=a.map(v=>Math.abs(v-med[k])).sort((p,q)=>p-q);return dv[dv.length>>1]+4});
  // Distance from surface; Otsu threshold
  const D=new Float32Array(W*H);let mx=0;
  for(let i=0;i<W*H;i++){let s=0;for(let k=0;k<3;k++){const v=(L[i*3+k]-med[k])/mad[k];s+=v*v}D[i]=Math.sqrt(s);if(D[i]>mx)mx=D[i]}
  const hist=new Array(256).fill(0);for(let i=0;i<W*H;i++)hist[Math.min(255,D[i]/mx*255|0)]++;
  let sum=0;for(let t=0;t<256;t++)sum+=t*hist[t];let sB=0,wB=0,best=0,th=40;
  for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=W*H-wB;if(!wF)break;sB+=t*hist[t];
    const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)**2;if(v>best){best=v;th=t}}
  const T=Math.max(th/255*mx,2.5);
  let M=new Uint8Array(W*H);for(let i=0;i<W*H;i++)M[i]=D[i]>T?1:0;
  // Build several candidate masks: "differs from surface" plus brightness cuts both ways
  const masks=[M],lum=new Float32Array(W*H);for(let i=0;i<W*H;i++)lum[i]=L[i*3];
  const sorted=Float32Array.from(lum).sort();
  for(const pc of [.35,.5,.65,.8]){const t=sorted[(W*H*pc)|0];
    const up=new Uint8Array(W*H),dn=new Uint8Array(W*H);for(let i=0;i<W*H;i++){up[i]=lum[i]>t+6?1:0;dn[i]=lum[i]<t-6?1:0}
    masks.push(up,dn)}
  let pick=null,bestScore=0;
  for(let m of masks){m=morph(morph(m,W,H,0),W,H,1);m=morph(morph(m,W,H,1),W,H,0); // open (break thin links) then close (fill text)
    for(const c of blobs(m,W,H)){if(c.n<W*H*0.06||c.n>W*H*0.95)continue;
      const fit=c.n/Math.max(1,c.qa);if(fit<0.82||fit>1.15)continue;
      if(c.touch>0.12)continue;
      const sc=c.n*fit*fit*(1-c.touch*3);if(sc>bestScore){bestScore=sc;pick=c.q}}}
  if(!pick)return live?null:full(im);
  return pick.map(p=>[(p[0]+.5)*f,(p[1]+.5)*f]);
}
function blobs(M,W,H){
  const lab=new Int32Array(W*H),out=[];let id=0;
  for(let s=0;s<W*H;s++){if(!M[s]||lab[s])continue;id++;const st=[s];lab[s]=id;
    let n=0,edge=0,per=0,tl=[0,0,1e9],tr=[0,0,-1e9],br=[0,0,-1e9],bl=[0,0,1e9];
    while(st.length){const p=st.pop();n++;const px=p%W,py=p/W|0;
      if(px<=3||py<=3||px>=W-4||py>=H-4)edge++;
      const sm=px+py,df=px-py;if(sm<tl[2])tl=[px,py,sm];if(sm>br[2])br=[px,py,sm];if(df>tr[2])tr=[px,py,df];if(df<bl[2])bl=[px,py,df];
      for(const q of [px>0?p-1:-1,px<W-1?p+1:-1,py>0?p-W:-1,py<H-1?p+W:-1])if(q>=0&&M[q]&&!lab[q]){lab[q]=id;st.push(q)}}
    const q=[tl,tr,br,bl];
    for(let i=0;i<4;i++)per+=Math.hypot(q[i][0]-q[(i+1)%4][0],q[i][1]-q[(i+1)%4][1]);
    let qa=0;for(let i=0;i<4;i++)qa+=q[i][0]*q[(i+1)%4][1]-q[(i+1)%4][0]*q[i][1];
    out.push({n,qa:Math.abs(qa)/2,touch:edge/Math.max(1,per),q})}
  return out;
}
function morph(M,W,H,dil){const o=new Uint8Array(W*H),r=2;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=dil?0:1;
    for(let dy=-r;dy<=r&&(dil?!v:v);dy++)for(let dx=-r;dx<=r;dx++){const yy=y+dy,xx=x+dx;const m=(yy<0||yy>=H||xx<0||xx>=W)?0:M[yy*W+xx];
      if(dil&&m){v=1;break}if(!dil&&!m){v=0;break}}o[y*W+x]=v}return o}
function full(im){const m=im.width*.05,n=im.height*.05;return [[m,n],[im.width-m,n],[im.width-m,im.height-n],[m,im.height-n]]}

/* ---- Perspective flatten ---- */
function homography(src,dst){ // maps dst -> src
  const A=[];for(let i=0;i<4;i++){const[x,y]=dst[i],[u,v]=src[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y,u]);A.push([0,0,0,x,y,1,-v*x,-v*y,v]);}
  for(let i=0;i<8;i++){let p=i;for(let r=i+1;r<8;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];
    for(let r=0;r<8;r++)if(r!==i){const k=A[r][i]/A[i][i];for(let c=i;c<9;c++)A[r][c]-=k*A[i][c]}}
  return A.map((r,i)=>r[8]/r[i]).concat(1);
}
function warp(pg){
  const img=pg.orig,q=pg.corners,dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let w=Math.max(dist(q[0],q[1]),dist(q[3],q[2])),h=Math.max(dist(q[0],q[3]),dist(q[1],q[2]));
  const lim=2400/Math.max(w,h);if(lim<1){w*=lim;h*=lim}w=Math.round(w);h=Math.round(h);
  const Hm=homography(q,[[0,0],[w,0],[w,h],[0,h]]);
  const sc=document.createElement('canvas');sc.width=img.width;sc.height=img.height;
  const sx=sc.getContext('2d');sx.drawImage(img,0,0);const S=sx.getImageData(0,0,img.width,img.height).data;
  const out=document.createElement('canvas');out.width=w;out.height=h;const ox=out.getContext('2d');
  const O=ox.createImageData(w,h),od=O.data,IW=img.width,IH=img.height;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const z=Hm[6]*x+Hm[7]*y+1,u=(Hm[0]*x+Hm[1]*y+Hm[2])/z,v=(Hm[3]*x+Hm[4]*y+Hm[5])/z;
    const x0=Math.min(IW-2,Math.max(0,u|0)),y0=Math.min(IH-2,Math.max(0,v|0)),fx=u-x0,fy=v-y0,o=(y*w+x)*4;
    for(let k=0;k<3;k++){const a=S[(y0*IW+x0)*4+k],b=S[(y0*IW+x0+1)*4+k],c=S[((y0+1)*IW+x0)*4+k],e=S[((y0+1)*IW+x0+1)*4+k];
      od[o+k]=(a*(1-fx)+b*fx)*(1-fy)+(c*(1-fx)+e*fx)*fy}od[o+3]=255}
  filter(od,pg.mode,w,h);ox.putImageData(O,0,0);return rotate(out,pg.rot);
}
/* Shadow removal: estimate the paper's lighting (max filter removes ink, blur smooths it), then divide it out */
function deshadow(d,w,h){
  const s=Math.max(1,Math.round(Math.max(w,h)/160)),sw=Math.ceil(w/s),sh=Math.ceil(h/s);
  const bg=[0,1,2].map(()=>new Float32Array(sw*sh));
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++)for(let k=0;k<3;k++){let m=0;
    for(let yy=y*s;yy<Math.min(h,y*s+s);yy++)for(let xx=x*s;xx<Math.min(w,x*s+s);xx++){const v=d[(yy*w+xx)*4+k];if(v>m)m=v}
    bg[k][y*sw+x]=m}
  const R=Math.max(2,Math.round(sw/40));
  const pass=(a,fn)=>{const o=new Float32Array(sw*sh);for(let y=0;y<sh;y++)for(let x=0;x<sw;x++)o[y*sw+x]=fn(a,x,y);return o};
  const box=(a,x,y,dx,dy,op)=>{let r=op==='max'?0:0,n=0;for(let t=-R;t<=R;t++){const xx=x+t*dx,yy=y+t*dy;if(xx<0||yy<0||xx>=sw||yy>=sh)continue;
    const v=a[yy*sw+xx];if(op==='max'){if(v>r)r=v}else{r+=v;n++}}return op==='max'?r:r/n};
  for(let k=0;k<3;k++){let a=bg[k];
    a=pass(a,(a,x,y)=>box(a,x,y,1,0,'max'));a=pass(a,(a,x,y)=>box(a,x,y,0,1,'max'));
    for(let i=0;i<2;i++){a=pass(a,(a,x,y)=>box(a,x,y,1,0,'avg'));a=pass(a,(a,x,y)=>box(a,x,y,0,1,'avg'))}
    bg[k]=a}
  for(let y=0;y<h;y++){const gy=Math.min(sh-1,y/s|0);for(let x=0;x<w;x++){const gi=gy*sw+Math.min(sw-1,x/s|0),o=(y*w+x)*4;
    for(let k=0;k<3;k++)d[o+k]=Math.min(255,d[o+k]*245/Math.max(20,bg[k][gi]))}}
}
function filter(d,mode,w,h){if(mode==='color')return;
  deshadow(d,w,h);if(mode==='clean')return;
  let lo=255,hi=0;const hs=new Array(256).fill(0);
  for(let i=0;i<d.length;i+=4)hs[(d[i]+d[i+1]+d[i+2])/3|0]++;
  let acc=0,n=d.length/4;for(let t=0;t<256;t++){acc+=hs[t];if(acc>n*.02&&lo===255)lo=t;if(acc>n*.9){hi=t;break}}
  const k=255/Math.max(1,hi-lo);
  for(let i=0;i<d.length;i+=4){
    if(mode==='enhance'){for(let j=0;j<3;j++)d[i+j]=Math.max(0,Math.min(255,(d[i+j]-lo)*k))}
    else{let g=((d[i]+d[i+1]+d[i+2])/3-lo)*k;if(mode==='bw')g=g>150?255:0;g=Math.max(0,Math.min(255,g));d[i]=d[i+1]=d[i+2]=g}}
}
