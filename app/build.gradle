plugins { id 'com.android.application' }
android {
    namespace 'com.paperscanner'
    compileSdk 34
    defaultConfig {
        applicationId "com.paperscanner"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "4.0"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
}
dependencies { implementation 'androidx.core:core:1.13.1'; implementation 'androidx.webkit:webkit:1.11.0' }
