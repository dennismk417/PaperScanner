name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        run: |
          DIR=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")
          echo "Project folder: $DIR"
          ls -R "$DIR" | head -50
          cd "$DIR"
          gradle assembleRelease --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/PaperScanner.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PaperScanner-apk
          path: out/PaperScanner.apk
